    <style>
      html, body { height: 100%; }
      body { overflow: hidden; }

      /* Terminal window */
      #term {
        background: #300A24;
        border-radius: .75rem;
        border: 1px solid rgba(247,247,245,.1);
        box-shadow: 0 30px 80px rgba(0,0,0,.6);
        display: flex; flex-direction: column;
        overflow: hidden;
        transform-origin: var(--ox, 50%) var(--oy, 50%);
        will-change: transform, filter;
      }
      .term-bar { display: flex; align-items: center; gap: .5rem; background: #3b3b3b; padding: .55rem .9rem; flex: none; }
      .term-dot { height: 13px; width: 13px; border-radius: 999px; }
      .term-title { margin-left: auto; margin-right: auto; font-family: 'Geist Mono', monospace; font-size: 12px; color: rgba(247,247,245,.75); }
      .term-bar .spacer { width: 55px; }
      #term-body {
        flex: 1; overflow-y: auto; padding: 1rem 1.2rem;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 14px; line-height: 1.75; color: #F7F7F5;
        white-space: pre-wrap; word-break: break-word;
      }
      #term-body .u { color: #8AE234; font-weight: 500; }  /* user@host */
      #term-body .p { color: #729FCF; }                     /* path */
      #term-body .c { color: rgba(247,247,245,.45); }       /* comments */
      #term-body .o { color: rgba(247,247,245,.85); }       /* output */
      #term-body .sig { color: #C8F03C; }
      .cursor { display: inline-block; width: 8px; height: 17px; background: #F7F7F5; vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* Entry cover: hides the page until the dot reveal plays */
      #reveal-cover { position: fixed; inset: 0; z-index: 94; background: #0B0B0C; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
